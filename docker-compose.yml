version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres2
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: payment-getway
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment-getway"]
      interval: 10s
      timeout: 5s
      retries: 5


  app:
   build: .
   container_name: payment-service
   restart: unless-stopped
   environment:
     DB_HOST: postgres
     DB_PORT: 5432
     DB_USERNAME: postgres
     DB_PASSWROD: root
     DB_NAME: payment-getway
     JWT_SECRET: mysecretkey
     JWT_EXPIRES_IN: 1d
   depends_on:
     postgres:
       condition: service_healthy

volumes:
  postgres_data: